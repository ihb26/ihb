[project.scripts]
ihbenchmark = "ihbenchmark.cli:main"
ihbenchmark-vis = "ihbenchmark_vis.cli:main"

[project.optional-dependencies]
ihbenchmark-vis = [
    "streamlit>=1.40.0",
]

[tool.setuptools]
packages = ["ihbenchmark", "ihbenchmark_vis"]

[tool.setuptools.package-dir]
ihbenchmark_vis = "ihbenchmark-vis"

[tool.setuptools.package-data]
ihbenchmark_vis = [
    "data/**/*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm_judge: predicates that depend on LLM judge behavior",
    "gliner: predicates that depend on GLiNER behavior",
]
addopts = "-q"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
